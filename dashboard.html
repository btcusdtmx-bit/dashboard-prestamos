<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GODIN PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:sans-serif;background:#0d0f14;color:#e4e8f0}
.hidden{display:none}
.card{background:#1e2330;padding:15px;border-radius:10px;margin:10px}
.val{font-size:22px;font-weight:bold}
.tab{padding:10px;background:#1e2330;color:#aaa;border:none;cursor:pointer}
.tab.active{background:#3ecf8e;color:#000}
table{width:100%;background:#1e2330;margin-top:10px}
th,td{padding:10px;text-align:left}
.green{color:#3ecf8e}
.red{color:#e05252}
.yellow{color:#f5a623}
</style>
</head>

<body>

<div id="login">
<h2>Login</h2>
<input id="email" placeholder="email">
<input id="pass" type="password">
<button onclick="login()">Entrar</button>
</div>

<div id="app" class="hidden">

<button class="tab active" onclick="go('dash')">📊</button>
<button class="tab" onclick="go('pres')">💰</button>
<button class="tab" onclick="go('cal')">📅</button>
<button class="tab" onclick="go('rep')">📈</button>
<button class="tab" onclick="go('conf')">⚙️</button>

<!-- DASHBOARD -->
<div id="dash">
<div class="card">Caja <div class="val" id="caja"></div></div>
<div class="card">Prestado <div class="val" id="cap"></div></div>
<div class="card">Por cobrar <div class="val" id="cob"></div></div>
<div class="card">Ganancia <div class="val" id="gan"></div></div>
</div>

<!-- PRESTAMOS -->
<div id="pres" class="hidden">
<button onclick="nuevo()">+ préstamo</button>
<input onkeyup="buscar()" id="buscador" placeholder="buscar">

<table>
<thead>
<tr>
<th>Cliente</th>
<th>Monto</th>
<th>Saldo</th>
<th>Tipo</th>
<th>Estado</th>
<th></th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>
</div>

<!-- CALENDARIO -->
<div id="cal" class="hidden">
<h3>Pagos próximos</h3>
<table>
<thead>
<tr>
<th>Cliente</th>
<th>Fecha</th>
<th>Tipo</th>
<th>Saldo</th>
<th>Status</th>
</tr>
</thead>
<tbody id="calendario"></tbody>
</table>
</div>

<!-- REPORTES -->
<div id="rep" class="hidden">
<h3>Reporte</h3>
<p id="r1"></p>
<p id="r2"></p>
<p id="r3"></p>
</div>

<!-- CONFIG -->
<div id="conf" class="hidden">
<h3>Cambiar contraseña</h3>
<input id="newPass">
<button onclick="changePass()">Guardar</button>
</div>

</div>

<script>
// SUPABASE (NO CAMBIADO)
const SB_URL='https://ehcfrserpdqthkdqizsz.supabase.co';
const SB_KEY='sb_publishable_F2qFK5tKBDtTJR6p7bg0bA_e1nlqPIL';
const sb=supabase.createClient(SB_URL,SB_KEY);

const USERS=['tony_bravo@hotmail.com','axlj31@gmail.com','enrique_sabori@hotmail.com'];
const PASS=localStorage.getItem('GODIN_PASS')||'Prestamos123';

// LOGIN
function login(){
let e=email.value;
let p=pass.value;
if(USERS.includes(e)&&p===PASS){
login.style.display='none';
app.classList.remove('hidden');
loadAll();
}else alert('error');
}

// TABS
function go(id){
['dash','pres','cal','rep','conf'].forEach(x=>{
document.getElementById(x).classList.add('hidden')
});
document.getElementById(id).classList.remove('hidden');

if(id==='cal')loadCal();
if(id==='rep')loadRep();
}

// DASHBOARD
async function loadDash(){
let {data:caja}=await sb.from('caja').select('*');
let {data:pres}=await sb.from('prestamos').select('*');

let cajaT=0,cap=0,cob=0,gan=0;

caja.forEach(r=>cajaT+=(r.tipo==='entrada'?r.monto:-r.monto));

pres.forEach(p=>{
if(p.estatus==='activo'){
cap+=p.monto_original;
cob+=p.saldo_actual;
gan+=(p.saldo_actual*p.interes_mensual);
}
});

caja.innerText='$'+cajaT.toFixed(2);
capel=cap;
cajaEl=document.getElementById('caja');
document.getElementById('caja').innerText='$'+cajaT;
document.getElementById('cap').innerText='$'+cap;
document.getElementById('cob').innerText='$'+cob;
document.getElementById('gan').innerText='$'+gan;

if(cajaT<0)cajaEl.className='red';
}

// PRESTAMOS
async function loadPres(){
let {data}=await sb.from('prestamos').select('*,clientes(nombre)');
let t=tabla; t.innerHTML='';

data.forEach(p=>{
t.innerHTML+=`
<tr>
<td>${p.clientes?.nombre}</td>
<td>${p.monto_original}</td>
<td>${p.saldo_actual}</td>
<td>${p.tipo_pago||'mensual'}</td>
<td>${p.estatus}</td>
<td><button onclick="abonar('${p.id}',${p.saldo_actual})">💰</button></td>
</tr>`;
});
}

// NUEVO
async function nuevo(){
let monto=prompt('monto');
let tipo=prompt('mensual o quincenal');

await sb.from('prestamos').insert({
monto_original:monto,
saldo_actual:monto,
tipo_pago:tipo,
estatus:'activo'
});
loadPres(); loadDash();
}

// ABONO
async function abonar(id,s){
let val=prompt('abono');
let nuevo=s-val;
await sb.from('prestamos').update({
saldo_actual:nuevo,
estatus:nuevo<=0?'pagado':'activo'
}).eq('id',id);

await sb.from('caja').insert({
tipo:'entrada',
monto:val
});

loadAll();
}

// CALENDARIO
async function loadCal(){
let {data}=await sb.from('prestamos').select('*,clientes(nombre)').eq('estatus','activo');

let hoy=new Date();

calendario.innerHTML='';

data.forEach(p=>{
let inicio=new Date(p.fecha_inicio||new Date());
let dias=p.tipo_pago==='quincenal'?15:30;

while(inicio<hoy)inicio.setDate(inicio.getDate()+dias);

let estado='OK',color='green';

if(inicio-hoy<3*86400000){estado='PRÓXIMO';color='yellow';}
if(inicio<hoy){estado='ATRASADO';color='red';}

calendario.innerHTML+=`
<tr>
<td>${p.clientes?.nombre}</td>
<td>${inicio.toLocaleDateString()}</td>
<td>${p.tipo_pago}</td>
<td>${p.saldo_actual}</td>
<td class="${color}">${estado}</td>
</tr>`;
});
}

// REPORTES
async function loadRep(){
let {data}=await sb.from('prestamos').select('*');

let total=0,count=0;

data.forEach(p=>{
if(p.estatus==='activo'){
total+=p.saldo_actual;count++;
}
});

r1.innerText='Total: $'+total;
r2.innerText='Activos: '+count;
r3.innerText='Promedio: '+(total/count).toFixed(2);
}

// BUSCAR
function buscar(){
let txt=buscador.value.toLowerCase();
document.querySelectorAll('#tabla tr').forEach(r=>{
r.style.display=r.innerText.toLowerCase().includes(txt)?'':'none';
});
}

// PASSWORD
function changePass(){
let p=newPass.value;
localStorage.setItem('GODIN_PASS',p);
alert('ok');
}

// INIT
function loadAll(){
loadDash();
loadPres();
}
</script>

</body>
</html>

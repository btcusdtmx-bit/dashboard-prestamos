<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Préstamos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0d0f14; --panel:#1e2330; --text:#e4e8f0; --accent:#3ecf8e; --error:#e05252; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Sora',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .panel { background:var(--panel); border-radius:20px; padding:40px; width:100%; max-width:400px; border:1px solid rgba(255,255,255,0.1); }
        .logo { text-align:center; margin-bottom:30px; }
        .logo h1 { font-size:1.5rem; margin-bottom:5px; }
        .logo p { color:#8892a4; font-size:0.8rem; }
        input { width:100%; padding:12px; margin:10px 0; background:#2c3347; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:var(--text); font-size:1rem; }
        input:focus { outline:none; border-color:var(--accent); }
        button { width:100%; padding:14px; background:var(--accent); color:#0d0f14; border:none; border-radius:8px; font-weight:700; cursor:pointer; margin-top:10px; }
        button:disabled { opacity:0.6; cursor:not-allowed; }
        .error { color:var(--error); font-size:0.9rem; margin-top:10px; min-height:20px; }
        .hidden { display:none; }
        /* Dashboard styles */
        .dashboard { max-width:1200px; margin:0 auto; padding:20px; }
        .header { display:flex; justify-content:space-between; align-items:center; padding:20px; background:var(--panel); border-radius:12px; margin-bottom:20px; }
        .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:30px; }
        .stat { background:var(--panel); padding:20px; border-radius:12px; }
        .stat h3 { color:#8892a4; font-size:0.8rem; margin-bottom:10px; }
        .stat .value { font-size:1.8rem; font-weight:700; font-family:'DM Mono',monospace; }
        table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:12px; overflow:hidden; }
        th, td { padding:14px; text-align:left; border-bottom:1px solid rgba(255,255,255,0.05); }
        th { color:#8892a4; font-size:0.75rem; text-transform:uppercase; }
        .badge { padding:4px 10px; border-radius:20px; font-size:0.75rem; font-weight:600; }
        .badge-active { background:rgba(62,207,142,0.15); color:var(--accent); }
        .btn-logout { background:var(--error); color:white; padding:8px 16px; border-radius:6px; border:none; cursor:pointer; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginPanel" class="panel">
        <div class="logo">
            <h1>🏦 Sistema de Préstamos</h1>
            <p>Panel de Administración</p>
        </div>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
        <button onclick="doLogin()" id="loginBtn">Iniciar Sesión</button>
        <div id="errorMsg" class="error"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardPanel" class="dashboard hidden">
        <div class="header">
            <h2>🏦 Panel de Control</h2>
            <button class="btn-logout" onclick="doLogout()">Salir</button>
        </div>
        
        <div class="stats">
            <div class="stat"><h3>Saldo Caja</h3><div class="value" id="statCaja">$0.00</div></div>
            <div class="stat"><h3>Préstamos Activos</h3><div class="value" id="statPrestamos">0</div></div>
            <div class="stat"><h3>Total Socios</h3><div class="value" id="statSocios">0</div></div>
            <div class="stat"><h3>Distribuido</h3><div class="value" id="statDist">$0.00</div></div>
        </div>

        <h3 style="margin:20px 0 10px">📋 Préstamos Recientes</h3>
        <div style="overflow-x:auto">
            <table>
                <thead><tr><th>Cliente</th><th>Monto</th><th>Saldo</th><th>Interés</th><th>Estado</th></tr></thead>
                <tbody id="tablePrestamos"><tr><td colspan="5" style="text-align:center">Cargando...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        // 🔐 CONFIGURACIÓN
        const SUPABASE_URL = 'https://ehcfrserpdqthkdqizsz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_F2qFK5tKBDtTJR6p7bg0bA_e1nlqPIL';
        const PASS = 'Prestamos123';
        const USERS = ['tony_bravo@hotmail.com','axlj31@gmail.com','enrique_sabori@hotmail.com','itzel_riv93@hotmail.com','memsnena1005@hotmail.com','patty_walter25@hotmail.com'];

        // ✅ Inicializar cliente (SOLO para leer datos, NO para auth)
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db:{schema:'public'}, auth:{persistSession:false} });

        // ✅ LOGIN 100% LOCAL - SIN LLAMADAS A AUTH
        async function doLogin() {
            const email = document.getElementById('email').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const err = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');
            
            err.textContent = '';
            
            // Validación local estricta
            if (!USERS.includes(email)) { err.textContent = '❌ Correo no registrado'; return; }
            if (pass !== PASS) { err.textContent = '❌ Contraseña incorrecta'; return; }
            
            // Éxito: cambiar vista
            btn.disabled = true; btn.textContent = 'Cargando...';
            document.getElementById('loginPanel').classList.add('hidden');
            document.getElementById('dashboardPanel').classList.remove('hidden');
            
            await loadData();
            btn.disabled = false; btn.textContent = 'Iniciar Sesión';
        }

        function doLogout() {
            document.getElementById('dashboardPanel').classList.add('hidden');
            document.getElementById('loginPanel').classList.remove('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        // ✅ Cargar datos de Supabase
        async function loadData() {
            try {
                // 1. Caja
                const {data:caja} = await sb.from('caja').select('monto,tipo');
                const ent = caja?.filter(r=>r.tipo==='entrada').reduce((s,r)=>s+r.monto,0)||0;
                const sal = caja?.filter(r=>r.tipo==='salida').reduce((s,r)=>s+r.monto,0)||0;
                document.getElementById('statCaja').textContent = `$${(ent-sal).toFixed(2)}`;

                // 2. Socios
                const {data:socios} = await sb.from('socios').select('id').eq('activo',true);
                document.getElementById('statSocios').textContent = socios?.length || 0;

                // 3. Distribuciones
                const {data:dist} = await sb.from('distribuciones').select('monto');
                const totalDist = dist?.reduce((s,r)=>s+r.monto,0)||0;
                document.getElementById('statDist').textContent = `$${totalDist.toFixed(2)}`;

                // 4. Préstamos
                const {data:pres} = await sb.from('prestamos').select('*,clientes(nombre)').order('created_at',{ascending:false}).limit(10);
                document.getElementById('statPrestamos').textContent = pres?.filter(p=>p.estatus==='activo').length || 0;
                
                const tbody = document.getElementById('tablePrestamos');
                tbody.innerHTML = '';
                if(!pres?.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Sin datos</td></tr>'; return; }
                
                pres.forEach(p => {
                    tbody.innerHTML += `<tr>
                        <td>${p.clientes?.nombre || 'N/A'}</td>
                        <td>$${parseFloat(p.monto_original||0).toFixed(0)}</td>
                        <td>$${parseFloat(p.saldo_actual||0).toFixed(0)}</td>
                        <td>${Math.round((p.interes_mensual||0)*100)}%</td>
                        <td><span class="badge badge-active">${p.estatus}</span></td>
                    </tr>`;
                });
            } catch(e) { console.error('Error cargando datos:', e); }
        }
    </script>
</body>
</html>
